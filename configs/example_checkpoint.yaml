checkpoint:
  path: checkpoints/hmtl_mmoe_dwa_example.pt
  sha256: 1eca97d7390988a7c96c411fed446ed2fd8038a981b51d8383cb1b008f7bd89a
  artifact_role: example_pretrained_weight
method:
  public_experiment_id: mmoe_dwa
  model_type: mmoe
  gradient_method: dwa
  gradient_kwargs:
    num_tasks: 10
    temperature: 2.0
provenance:
  source_experiment: 10fold_v38_seed42_repro/mmoe_dwa
  seed: 42
  saved_epoch: 16
